{{- if ne (int .Values.replicaCount) 1 }}
{{- fail "Edition backup downloads currently require replicaCount=1 (shared temporary pod storage)." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ldsa-portal.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ include "ldsa-portal.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "ldsa-portal.name" . }}
        environment: {{ .Values.environment }}
    spec:
      restartPolicy: Always
      securityContext:
        fsGroup: 10001
      volumes:
        - name: edition-backups
          emptyDir: {}
        - name: kubeconfig-volume
          configMap:
            name: {{ .Values.kubeconfigConfigMapName }}
        - name: aws-volume
          configMap:
            name: {{ .Values.awsConfigMapName }}
      containers:
        - image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          name: django
          resources: {}
          args:
            - {{ .Values.startScript }}
          volumeMounts:
            - name: edition-backups
              mountPath: /tmp/ldsa-portal-backups
            - name: kubeconfig-volume
              mountPath: /home/django/.kube/
            - name: aws-volume
              mountPath: /home/django/.aws/
          env: &portalEnv
{{ include "ldsa-portal.environment" . | indent 12 }}
        - image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          name: admissions-scheduler
          resources: {}
          args:
            - /app/bin/start_scheduler.sh
          env: *portalEnv
        - image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          name: edition-worker
          args:
            - /app/bin/start_edition_worker.sh
          env: *portalEnv
          volumeMounts:
            - name: edition-backups
              mountPath: /tmp/ldsa-portal-backups
            - name: kubeconfig-volume
              mountPath: /home/django/.kube/
            - name: aws-volume
              mountPath: /home/django/.aws/
